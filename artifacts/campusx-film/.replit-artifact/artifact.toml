kind = "video"
videoAspectRatio = "16:9"
previewPath = "/campusx-film/"
title = "CampusX — One Campus, Every Connection"
description = "A branded animated 16:9 overview of the CampusX student network, showing campus conversations, shuttles, marketplace offers, study planning, and WAZOBIA."
version = "1.0.0"
id = "artifacts/campusx-film"
router = "path"

[[services]]
name = "web"
paths = [ "/campusx-film/" ]
localPort = 18691

[services.development]
run = "pnpm --filter @workspace/campusx-film run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campusx-film", "run", "build" ]
serve = "static"
publicDir = "artifacts/campusx-film/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18691"
BASE_PATH = "/campusx-film/"
