kind = "mobile"
previewPath = "/mobile/"
title = "CampusX Mobile"
version = "1.0.0"
id = "artifacts/campusx-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22109

[services.development]
run = "pnpm --filter @workspace/campusx-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campusx-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/campusx-mobile", "run", "serve" ]

[services.env]
PORT = "22109"
BASE_PATH = "/mobile/"
