          enum: [approved, rejected]
        adminDecisionNote:
          type: [string, 'null']
        decidedByClerkId:
          type: string
        decidedAt:
          type: string
          format: date-time

    AdCampaignInput:
      type: object
      additionalProperties: false
      required: [paymentReference, title, body, destinationUrl]
      properties:
        paymentReference:
          type: string
          minLength: 1
          maxLength: 200
        title:
          type: string
          minLength: 1
          maxLength: 100
        body:
          type: string
          minLength: 1
          maxLength: 2000
        destinationUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Must be a public HTTPS URL; credentials and local/private destinations are rejected.

    AdCampaignCreated:
      type: object
      required: [id, status, expiresAt]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending]
        expiresAt:
          type: string
          format: date-time

    ActiveAdCampaign:
      type: object
      required: [id, title, body, destinationUrl, packageType, expiresAt]
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        destinationUrl:
          type: string
          format: uri
        packageType:
          $ref: '#/components/schemas/PaymentPackage'
        expiresAt:
          type: string
          format: date-time

    ActiveAdsResponse:
      type: object
      required: [ads]
      properties:
        ads:
          type: array
          items:
            $ref: '#/components/schemas/ActiveAdCampaign'

    MyAdCampaign:
      type: object
      required: [id, paymentReference, title, status, expiresAt, createdAt]
      properties:
        id:
          type: integer
        paymentReference:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        expiresAt:
          type: string
          format: date-time
        rejectionReason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    MyAdCampaignsResponse:
      type: object
      required: [campaigns]
      properties:
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/MyAdCampaign'

    AdminAdCampaign:
      allOf:
        - $ref: '#/components/schemas/ActiveAdCampaign'
        - type: object
          required: [ownerClerkUserId, paymentReference, school, campusLocation, status, createdAt]
          properties:
            ownerClerkUserId:
              type: string
            paymentReference:
              type: string
            school:
              type: string
            campusLocation:
              type: string
            status:
              type: string
              enum: [pending]
            createdAt:
              type: string
              format: date-time

    AdminAdCampaignsResponse:
      type: object
      required: [campaigns]
      properties:
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/AdminAdCampaign'

    AdCampaignDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        rejectionReason:
          type: string
          maxLength: 500

    AdCampaignDecisionResult:
      type: object
      required: [id, status, decidedAt]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [approved, rejected]
        decidedAt:
          type: string
          format: date-time
