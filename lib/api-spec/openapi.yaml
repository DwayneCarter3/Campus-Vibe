openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CampusX API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: posts
    description: Feed post operations
  - name: services
    description: Earn Legally marketplace services
  - name: stats
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Get current user profile (includes private fields)
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    put:
      operationId: updateMyProfile
      tags: [users]
      summary: Create or update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /users/{userId}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a public user profile (private fields excluded)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserProfile"
        "404":
          description: User not found

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List feed posts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: faculty
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPostsResponse"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a new feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a single post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post (owner only)
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /posts/{postId}/like:
    post:
      operationId: likePost
      tags: [posts]
      summary: Toggle fire reaction on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fire toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "401":
          description: Unauthorized

  /posts/{postId}/nocap:
    post:
      operationId: noCapPost
      tags: [posts]
      summary: Toggle no-cap reaction on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: No Cap toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoCapResponse"
        "401":
          description: Unauthorized

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List marketplace services
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: category
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServicesResponse"
    post:
      operationId: createService
      tags: [services]
      summary: List a new service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceBody"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /services/{serviceId}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a single service listing
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service listing (owner only)
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceBody"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service listing (owner only)
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /stats/feed:
    get:
      operationId: getFeedStats
      tags: [stats]
      summary: Get feed statistics (post counts by faculty, trending topics)
      responses:
        "200":
          description: Feed stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedStats"

  /stats/marketplace:
    get:
      operationId: getMarketplaceStats
      tags: [stats]
      summary: Get marketplace stats (service counts by category)
      responses:
        "200":
          description: Marketplace stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        fullName:
          type: string
        email:
          type: string
        school:
          type: string
        campusLocation:
          type: string
        level:
          type: string
        faculty:
          type: string
        enrollmentStatus:
          type: string
        matricNumber:
          type: string
        campus:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clerkUserId
        - fullName
        - email
        - school
        - campusLocation
        - level
        - faculty
        - enrollmentStatus
        - matricNumber
        - campus
        - bio
        - avatarUrl
        - createdAt

    PublicUserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        fullName:
          type: string
        school:
          type: string
        campusLocation:
          type: string
        level:
          type: string
        faculty:
          type: string
        enrollmentStatus:
          type: string
        campus:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
      required:
        - id
        - clerkUserId
        - fullName
        - school
        - campusLocation
        - level
        - faculty
        - enrollmentStatus
        - campus
        - bio
        - avatarUrl

    UpdateProfileBody:
      type: object
      properties:
        fullName:
          type: string
        school:
          type: string
        campusLocation:
          type: string
        level:
          type: string
        faculty:
          type: string
        enrollmentStatus:
          type: string
        matricNumber:
          type: string
        campus:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]

    Post:
      type: object
      properties:
        id:
          type: integer
        authorId:
          type: string
        authorName:
          type: string
        authorFaculty:
          type: string
        authorLevel:
          type: string
        authorCampusLocation:
          type: string
        authorAvatarUrl:
          type: ["string", "null"]
        content:
          type: string
        imageUrl:
          type: ["string", "null"]
        likesCount:
          type: integer
        isLikedByMe:
          type: boolean
        noCapsCount:
          type: integer
        isNoCapByMe:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - authorId
        - authorName
        - authorFaculty
        - authorLevel
        - authorCampusLocation
        - authorAvatarUrl
        - content
        - imageUrl
        - likesCount
        - isLikedByMe
        - noCapsCount
        - isNoCapByMe
        - createdAt

    ListPostsResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        total:
          type: integer
      required:
        - posts
        - total

    CreatePostBody:
      type: object
      properties:
        content:
          type: string
        imageUrl:
          type: ["string", "null"]
      required:
        - content

    LikeResponse:
      type: object
      properties:
        liked:
          type: boolean
        likesCount:
          type: integer
      required:
        - liked
        - likesCount

    NoCapResponse:
      type: object
      properties:
        noCaped:
          type: boolean
        noCapsCount:
          type: integer
      required:
        - noCaped
        - noCapsCount

    Service:
      type: object
      properties:
        id:
          type: integer
        providerId:
          type: string
        providerName:
          type: string
        providerFaculty:
          type: string
        providerLevel:
          type: string
        providerCampusLocation:
          type: string
        providerIsVerified:
          type: boolean
        providerAvatarUrl:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: ["string", "null"]
        contactInfo:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - providerId
        - providerName
        - providerFaculty
        - providerLevel
        - providerCampusLocation
        - providerIsVerified
        - providerAvatarUrl
        - title
        - description
        - category
        - price
        - contactInfo
        - isActive
        - createdAt

    ListServicesResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        total:
          type: integer
      required:
        - services
        - total

    CreateServiceBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: ["string", "null"]
        contactInfo:
          type: string
      required:
        - title
        - description
        - category
        - contactInfo

    UpdateServiceBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: ["string", "null"]
        contactInfo:
          type: string
        isActive:
          type: boolean

    FeedStats:
      type: object
      properties:
        totalPosts:
          type: integer
        postsByFaculty:
          type: array
          items:
            $ref: "#/components/schemas/FacultyCount"
        recentActivity:
          type: integer
      required:
        - totalPosts
        - postsByFaculty
        - recentActivity

    FacultyCount:
      type: object
      properties:
        faculty:
          type: string
        count:
          type: integer
      required:
        - faculty
        - count

    MarketplaceStats:
      type: object
      properties:
        totalServices:
          type: integer
        servicesByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
      required:
        - totalServices
        - servicesByCategory

    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
        - category
        - count
