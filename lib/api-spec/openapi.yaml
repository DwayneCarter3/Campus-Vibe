openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CampusX API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: posts
    description: Feed post operations
  - name: services
    description: Earn Legally marketplace services
  - name: stats
    description: Dashboard statistics
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: messages
    description: Direct messaging between users
  - name: admin
    description: Admin dashboard operations
  - name: payments
    description: Paystack payments and early-bird benefit claims
  - name: matricClaims
    description: Private matric-account fraud claim requests and admin decisions
  - name: ads
    description: Paid campus ad campaigns and moderation

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /shuttle-status:
    get:
      operationId: getShuttleStatus
      tags: [services]
      summary: Get the current shuttle queue status
      responses:
        "200":
          description: Current shuttle status and vote summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShuttleStatus"
  /shuttle-status/vote:
    post:
      operationId: voteShuttleStatus
      tags: [services]
      summary: Cast or update the authenticated user's shuttle status vote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShuttleVoteInput"
      responses:
        "200":
          description: Updated shuttle status and vote summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShuttleStatus"
        "400":
          description: Invalid vote
        "401":
          description: Unauthorized

  /users/me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Get current user profile (includes private fields)
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    put:
      operationId: updateMyProfile
      tags: [users]
      summary: Create or update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /users/me/cgpa-plan:
    get:
      operationId: getMyCgpaPlan
      tags: [users]
      summary: Get the authenticated user's private CGPA plan
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's CGPA plan, or an empty plan when none has been saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CgpaPlan"
        "401":
          description: Unauthorized
    put:
      operationId: saveMyCgpaPlan
      tags: [users]
      summary: Replace the authenticated user's private CGPA plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CgpaPlanInput"
      responses:
        "200":
          description: Saved CGPA plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CgpaPlan"
        "400":
          description: Invalid CGPA plan
        "401":
          description: Unauthorized

  /users/me/request-badge:
    post:
      operationId: requestPremiumBadge
      tags: [users]
      summary: Deprecated legacy badge request; use /payments/initialize instead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestBadgeBody"
      responses:
        "410":
          description: Legacy badge requests are disabled; use the Paystack or early-bird payment flow.
        "401":
          description: Unauthorized

  /users/search:
    get:
      operationId: searchStudents
      tags: [users]
      summary: Search peers within the signed-in user's institution
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matching student profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSearchResponse"
        "401":
          description: Unauthorized
        "400":
          description: Search term must contain at least two characters

  /users/{userId}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a public user profile (private fields excluded)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserProfile"
        "404":
          description: User not found

  /users/{userId}/posts:
    get:
      operationId: getUserPosts
      tags: [users]
      summary: Get all posts by a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: User posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPostsResponse"
        "404":
          description: User not found

  /users/{userId}/services:
    get:
      operationId: getUserServices
      tags: [users]
      summary: Get all active services by a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: User services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServicesResponse"
        "404":
          description: User not found

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List feed posts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: Opaque continuation cursor bound to the active filters.
          schema:
            type: string
            maxLength: 2048
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: savedOnly
          in: query
          schema:
            type: boolean
        - name: faculty
          in: query
          schema:
            type: ["string", "null"]
        - name: category
          in: query
          schema:
            type: string
            enum: [Shuttle Updates, Portal Down, Exam Timetable, Amebo Hot, Campus News, Strike Update]
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPostsResponse"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a new feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a single post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Edit the text of a post (author only)
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostBody"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post (owner or moderator+)
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /posts/{postId}/save:
    post:
      operationId: toggleSavePost
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Save state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResponse"

  /posts/{postId}/report:
    post:
      operationId: reportPost
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportBody"
      responses:
        "201":
          description: Report added to review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"

  /posts/{postId}/feature:
    patch:
      operationId: toggleFeaturePost
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trending Gist state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureResponse"

  /polls/{pollId}/vote:
    post:
      operationId: votePoll
      tags: [posts]
      summary: Cast one vote on an active poll
      parameters:
        - name: pollId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollVoteInput"
      responses:
        "200":
          description: Updated poll with results visible to the voter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
        "400":
          description: Invalid option
        "401":
          description: Sign-in required
        "404":
          description: Poll not found
        "409":
          description: Poll ended or student has already voted

  /posts/{postId}/like:
    post:
      operationId: likePost
      tags: [posts]
      summary: Toggle fire reaction on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fire toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "401":
          description: Unauthorized

  /posts/{postId}/nocap:
    post:
      operationId: noCapPost
      tags: [posts]
      summary: Toggle no-cap reaction on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: No Cap toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoCapResponse"
        "401":
          description: Unauthorized

  /posts/{postId}/comments:
    get:
      operationId: listPostComments
      tags: [posts]
      summary: List comments on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommentsResponse"
        "404":
          description: Post not found
    post:
      operationId: createPostComment
      tags: [posts]
      summary: Add a comment to a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List marketplace services
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: Opaque continuation cursor bound to the active filters.
          schema:
            type: string
            maxLength: 2048
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: savedOnly
          in: query
          schema:
            type: boolean
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: flashSale
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServicesResponse"
    post:
      operationId: createService
      tags: [services]
      summary: List a new service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /services/{serviceId}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a single service listing
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service listing (owner only)
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service listing (owner only)
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /services/{serviceId}/save:
    post:
      operationId: toggleSaveService
      tags: [services]
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Save state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResponse"

  /services/{serviceId}/report:
    post:
      operationId: reportService
      tags: [services]
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportBody"
      responses:
        "201":
          description: Report added to review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"

  /services/{serviceId}/feature:
    patch:
      operationId: toggleFeatureService
      tags: [services]
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Featured listing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureResponse"

  /services/{serviceId}/pin-profile:
    patch:
      operationId: pinServiceToProfile
      tags: [services]
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile pin state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List recent notifications for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNotificationsResponse"
        "401":
          description: Unauthorized

  /notifications/read:
    patch:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All notifications marked as read
        "401":
          description: Unauthorized

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one of the current user's notifications as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Notification marked as read
        "401":
          description: Unauthorized
        "404":
          description: Notification not found for this user

  /services/{serviceId}/whatsapp-click:
    post:
      operationId: trackWhatsappClick
      tags: [services]
      summary: Track a WhatsApp interest click and notify the provider
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /stats/feed:
    get:
      operationId: getFeedStats
      tags: [stats]
      summary: Get feed statistics (post counts by faculty, trending topics)
      responses:
        "200":
          description: Feed stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedStats"

  /posts/{postId}/reshare:
    post:
      tags: [posts]
      operationId: resharePost
      summary: Reshare or quote-reshare a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResharePostBody'
      responses:
        '200':
          description: Reshared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResharePostResponse'
        '400':
          description: Cannot reshare your own post or already reshared.
        '401':
          description: Unauthorized.
        '404':
          description: Post not found.

  /posts/{postId}/pin-profile:
    patch:
      tags: [posts]
      operationId: pinPostToProfile
      summary: Toggle pin post to user's profile
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pin toggled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinResponse'
        '401':
          description: Unauthorized.
        '403':
          description: Not the author.
        '404':
          description: Post not found.

  /posts/{postId}/pin-feed:
    patch:
      tags: [posts]
      operationId: pinPostToFeed
      summary: Toggle pin post to main feed (admin only)
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pin toggled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinResponse'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden – admin only.
        '404':
          description: Post not found.

  /admin/reports:
    get:
      operationId: listAdminReports
      tags: [admin]
      summary: Pending post and listing reports (CEO/admin only)
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsResponse"

  /admin/reports/{reportId}:
    patch:
      operationId: reviewAdminReport
      tags: [admin]
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewReportBody"
      responses:
        "200":
          description: Report status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportItem"

  /admin/claim:
    post:
      tags: [admin]
      operationId: claimAdmin
      summary: Bootstrap – claim admin role (only works if no admin exists)
      responses:
        '200':
          description: Admin role claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClaimResponse'
        '403':
          description: An admin already exists.
        '401':
          description: Unauthorized.

  /admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: List all users (admin/CEO)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAdminUsersResponse'
        '403':
          description: Admin/CEO only.
        '401':
          description: Unauthorized.

  /admin/users/{userId}/role:
    patch:
      tags: [admin]
      operationId: updateUserRole
      summary: Update a user's role (CEO only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleBody'
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserRoleResponse'
        '403':
          description: CEO only.
        '401':
          description: Unauthorized.

  /admin/pending-verifications:
    get:
      tags: [admin]
      operationId: listPendingVerifications
      summary: List users with pending badge verification (admin/CEO)
      responses:
        '200':
          description: Pending verifications list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPendingVerificationsResponse'
        '403':
          description: Admin/CEO only.
        '401':
          description: Unauthorized.

  /admin/users/{userId}/approve-badge:
    post:
      tags: [admin]
      operationId: approveBadge
      summary: Approve a user's premium badge (admin/CEO)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Badge approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveBadgeResponse'
        '403':
          description: Admin/CEO only.
        '401':
          description: Unauthorized.

  /admin/users/{userId}/reject-badge:
    post:
      tags: [admin]
      operationId: rejectBadge
      summary: Reject a pending verification or revoke an existing badge
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Badge rejected or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveBadgeResponse'
        '403':
          description: Admin/CEO only.
        '401':
          description: Unauthorized.

  /admin/users/{userId}/verification:
    patch:
      tags: [admin]
      operationId: setUserVerification
      summary: Approve or revoke any user's verification from the user list
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserVerificationBody'
      responses:
        '200':
          description: Verification status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetUserVerificationResponse'
        '403':
          description: Admin/CEO only.
        '401':
          description: Unauthorized.

  /payments/products:
    get:
      tags: [payments]
      operationId: listPaymentProducts
      summary: List available products, fixed durations, and customer-payable amounts
      responses:
        '200':
          description: Product catalog; amountKobo includes the current Paystack customer-paid fee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProductsResponse'

  /payments/initialize:
    post:
      tags: [payments]
      operationId: initializePayment
      summary: Initialize a Paystack payment or claim an eligible early-bird benefit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializePaymentBody'
      responses:
        '200':
          description: Payment initialized or an eligible early-bird benefit claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializePaymentResponse'
        '400':
          description: Invalid package.
        '404':
          description: Profile not found.
        '503':
          description: Payment provider is not configured.

  /payments/{reference}:
    get:
      tags: [payments]
      operationId: getPaymentStatus
      summary: Get the current status of one of the current user's payments
      security:
        - bearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
        '404':
          description: Payment not found.

  /payments/webhook/paystack:
    post:
      tags: [payments]
      operationId: receivePaystackWebhook
      summary: Receive a signed Paystack webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/PaystackWebhookInput'
      responses:
        '200':
          description: Webhook accepted.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
        '401':
          description: Invalid signature.

  /payments:
    get:
      tags: [payments]
      operationId: listPayments
      summary: List the current user's payments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPaymentsResponse'

  /ads:
    get:
      tags: [ads]
      operationId: listActiveAds
      summary: List approved, unexpired ads for the signed-in viewer's campus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active campaigns matching the viewer's school and campus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveAdsResponse'
        '401':
          description: Unauthorized.
    post:
      tags: [ads]
      operationId: submitAdCampaign
      summary: Submit an ad using an owned paid, unexpired ad purchase
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdCampaignInput'
      responses:
        '201':
          description: Campaign submitted for manual moderation; it is not published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCampaignCreated'
        '400':
          description: Invalid campaign content or destination.
        '401':
          description: Unauthorized.
        '403':
          description: No matching paid and unexpired ad purchase.
        '409':
          description: Purchase reference already used for a campaign.

  /ads/mine:
    get:
      tags: [ads]
      operationId: listMyAdCampaigns
      summary: List the signed-in user's ad campaign submissions and review states
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Campaigns submitted by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAdCampaignsResponse'
        '401':
          description: Unauthorized.

  /admin/ads:
    get:
      tags: [ads, admin]
      operationId: listPendingAdCampaigns
      summary: List campaigns awaiting admin moderation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending ad campaigns for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAdCampaignsResponse'
        '401':
          description: Unauthorized.
        '403':
          description: Admin/CEO only.

  /admin/ads/{campaignId}/decision:
    patch:
      tags: [ads, admin]
      operationId: decideAdCampaign
      summary: Approve or reject a pending ad campaign
      security:
        - bearerAuth: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdCampaignDecisionInput'
      responses:
        '200':
          description: Moderation decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCampaignDecisionResult'
        '400':
          description: Invalid decision.
        '401':
          description: Unauthorized.
        '403':
          description: Admin/CEO only.
        '404':
          description: Pending campaign not found.

  /messages/conversations:
    get:
      tags: [messages]
      operationId: listConversations
      summary: List my conversations
      responses:
        '200':
          description: Conversations list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConversationsResponse'
        '401':
          description: Unauthorized.
    post:
      tags: [messages]
      operationId: startConversation
      summary: Start or get a conversation with a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationBody'
      responses:
        '200':
          description: Conversation (existing or new)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '401':
          description: Unauthorized.

  /messages/conversations/{conversationId}/messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: List messages in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMessagesResponse'
        '401':
          description: Unauthorized.
        '403':
          description: Not a participant.
    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send a message in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageBody'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectMessage'
        '401':
          description: Unauthorized.
        '403':
          description: Not a participant.

  /wazobia/language:
    get:
      tags: [messages]
      operationId: getWazobiaLanguage
      summary: Get the current user's WAZOBIA response language
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current preference (English by default)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WazobiaLanguageResponse'
        '401':
          description: Unauthorized.
    put:
      tags: [messages]
      operationId: setWazobiaLanguage
      summary: Set the current user's WAZOBIA response language
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WazobiaLanguageInput'
      responses:
        '200':
          description: Saved language preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WazobiaLanguageResponse'
        '400':
          description: Unsupported language.
        '401':
          description: Unauthorized.

  /wazobia/chat:
    post:
      tags: [messages]
      operationId: chatWithWazobia
      summary: Send a message to WAZOBIA and receive an AI reply
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WazobiaChatInput'
      responses:
        '200':
          description: Persisted AI reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WazobiaChatResponse'
        '400':
          description: Invalid message.
        '401':
          description: Unauthorized.
        '429':
          description: Per-account chat rate limit exceeded.
          headers:
            Retry-After:
              description: Seconds until the account can retry.
              schema:
                type: integer
        '503':
          description: No supported AI provider key is configured or in-memory limiter capacity is exhausted.

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.

  /matric-claims/uploads/request-url:
    post:
      operationId: requestMatricClaimEvidenceUploadUrl
      tags: [matricClaims]
      summary: Request a private signed upload URL for claim evidence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatricClaimEvidenceUploadRequest'
      responses:
        '201':
          description: Signed upload URL issued. Upload bytes directly using PUT before submitting the claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatricClaimEvidenceUploadResponse'
        '400':
          description: Unsupported content type, document type, or size.
        '401':
          description: Unauthorized.
        '429':
          description: Per-account evidence upload rate limit exceeded.
        '500':
          description: Failed to issue upload URL.
  /matric-claims:
    post:
      operationId: submitMatricClaim
      tags: [matricClaims]
      summary: Submit an authenticated matric account claim against a matching institution and matric number
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatricClaimSubmission'
      responses:
        '201':
          description: Claim submitted for review. Account ownership and matric data remain unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatricClaimCreated'
        '400':
          description: Invalid claim or evidence.
        '401':
          description: Unauthorized.
        '404':
          description: No existing account matches the supplied institution and normalized matric number.
        '409':
          description: Claim is already pending or a matching account claim is otherwise conflicting.
        '429':
          description: Per-account claim submission rate limit exceeded.
  /matric-claims/mine:
    get:
      operationId: listMyMatricClaims
      tags: [matricClaims]
      summary: List only the authenticated claimant's requests and status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated claimant's claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMatricClaimsResponse'
        '401':
          description: Unauthorized.
  /admin/matric-claims:
    get:
      operationId: listAdminMatricClaims
      tags: [matricClaims]
      summary: List matric claims for admin/CEO review
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: Claims available to an admin or CEO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMatricClaimsResponse'
        '400':
          description: Invalid status filter.
        '401':
          description: Unauthorized.
        '403':
          description: Admin/CEO access required.
  /admin/matric-claims/{claimId}/decision:
    patch:
      operationId: resolveMatricClaim
      tags: [matricClaims]
      summary: Record a final review decision without transferring an account
      security:
        - bearerAuth: []
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatricClaimDecisionInput'
      responses:
        '200':
          description: Decision, reviewer, note, and timestamp recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatricClaimDecisionResult'
        '400':
          description: Invalid claim ID or decision.
        '401':
          description: Unauthorized.
        '403':
          description: Admin/CEO access required.
        '404':
          description: Claim not found.
        '409':
          description: Claim has already been decided.
  /matric-claims/{claimId}/evidence:
    get:
      operationId: getMatricClaimEvidence
      tags: [matricClaims]
      summary: Stream evidence privately to the claimant or an admin/CEO
      security:
        - bearerAuth: []
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Private evidence stream, returned as an attachment with no-store caching.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized.
        '403':
          description: Only the claimant or an admin/CEO may view this evidence.
        '404':
          description: Claim or evidence not found.

  /stats/marketplace:
    get:
      operationId: getMarketplaceStats
      tags: [stats]
      summary: Get marketplace stats (service counts by category)
      responses:
        "200":
          description: Marketplace stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceStats"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CgpaPlanCourse:
      type: object
      additionalProperties: false
      required: [code, units, grade]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        units:
          type: integer
          minimum: 1
          maximum: 30
        grade:
          type: string
          enum: [A, B, C, D, E, F]

    CgpaPlanInput:
      type: object
      additionalProperties: false
      required: [currentCgpa, completedUnits, targetCgpa, remainingUnits, courses]
      properties:
        currentCgpa:
          type: [number, "null"]
          minimum: 0
          maximum: 5
        completedUnits:
          type: [integer, "null"]
          minimum: 0
        targetCgpa:
          type: [number, "null"]
          minimum: 0
          maximum: 5
        remainingUnits:
          type: [integer, "null"]
          minimum: 0
        courses:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CgpaPlanCourse"

    CgpaPlan:
      type: object
      additionalProperties: false
      required: [currentCgpa, completedUnits, targetCgpa, remainingUnits, courses, updatedAt]
      properties:
        currentCgpa:
          type: [number, "null"]
          minimum: 0
          maximum: 5
        completedUnits:
          type: [integer, "null"]
          minimum: 0
        targetCgpa:
          type: [number, "null"]
          minimum: 0
          maximum: 5
        remainingUnits:
          type: [integer, "null"]
          minimum: 0
        courses:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CgpaPlanCourse"
        updatedAt:
          type: [string, "null"]
          format: date-time

    AppNotification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        actorName:
          type: ["string", "null"]
        message:
          type: string
        content:
          type: string
        targetType:
          type: ["string", "null"]
        targetId:
          type: ["string", "null"]
        isRead:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - type
        - actorName
        - message
        - content
        - targetType
        - targetId
        - isRead
        - createdAt

    ListNotificationsResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/AppNotification"
        unreadCount:
          type: integer
      required:
        - notifications
        - unreadCount

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        fullName:
          type: string
        username:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        email:
          type: string
        school:
          type: string
        campusLocation:
          type: string
        level:
          type: string
        manualLevel:
          type: string
          description: "Saved selection; empty when level is computed from the matric number."
        faculty:
          type: string
        enrollmentStatus:
          type: string
        matricNumber:
          type: string
        campus:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        role:
          type: string
        registrationRank:
          type: integer
        premiumBadgeDiscountPercent:
          type: integer
        promoExpiresAt:
          type: ["string", "null"]
          format: date-time
        hustlePromoExpiresAt:
          type: ["string", "null"]
          format: date-time
        campusTitle:
          type: string
        verificationStatus:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clerkUserId
        - fullName
        - username
        - department
        - email
        - school
        - campusLocation
        - level
        - manualLevel
        - faculty
        - enrollmentStatus
        - matricNumber
        - campus
        - bio
        - avatarUrl
        - isAdmin
        - role
        - registrationRank
        - premiumBadgeDiscountPercent
        - promoExpiresAt
        - hustlePromoExpiresAt
        - campusTitle
        - verificationStatus
        - createdAt

    PublicUserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        fullName:
          type: string
        username:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        school:
          type: string
        campusLocation:
          type: string
        level:
          type: string
        faculty:
          type: string
        enrollmentStatus:
          type: string
        campus:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isVerified:
          type: boolean
        role:
          type: string
        campusTitle:
          type: string
        verificationStatus:
          type: string
      required:
        - id
        - clerkUserId
        - fullName
        - username
        - department
        - school
        - campusLocation
        - level
        - faculty
        - enrollmentStatus
        - campus
        - bio
        - avatarUrl
        - isVerified
        - role
        - campusTitle
        - verificationStatus

    UpdateProfileBody:
      type: object
      properties:
        fullName:
          type: string
        username:
          type: ["string", "null"]
          description: "Optional unique lowercase handle (3–24 letters, numbers, or underscores); null clears it."
        department:
          type: ["string", "null"]
          description: "Optional department name; null clears it."
        school:
          type: string
        campusLocation:
          type: string
        level:
          type: string
          description: "A manually selected level, or an empty string for automatic matric-based level."
          enum: ["", 100L, 200L, 300L, 400L, 500L, Alumni/Postgrad]
        faculty:
          type: string
        enrollmentStatus:
          type: string
        matricNumber:
          type: string
        campus:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]

    StudentSearchResult:
      type: object
      properties:
        userId:
          type: string
        fullName:
          type: string
        username:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        verificationStatus:
          type: string
      required: [userId, fullName, username, department, avatarUrl, verificationStatus]

    StudentSearchResponse:
      type: object
      properties:
        students:
          type: array
          items:
            $ref: "#/components/schemas/StudentSearchResult"
      required: [students]

    RequestBadgeBody:
      type: object
      required: [badgeType]
      properties:
        badgeType:
          type: string
          enum: [promo, paid]

    RequestBadgeResponse:
      type: object
      required: [success, verificationStatus]
      properties:
        success:
          type: boolean
        verificationStatus:
          type: string

    Post:
      type: object
      properties:
        id:
          type: integer
        authorId:
          type: string
        authorName:
          type: string
        authorFaculty:
          type: string
        authorLevel:
          type: string
        authorCampusLocation:
          type: string
        authorAvatarUrl:
          type: ["string", "null"]
        authorCampusTitle:
          type: string
        authorRole:
          type: string
        authorIsVerified:
          type: boolean
        authorVerificationStatus:
          type: string
        isAnonymous:
          type: boolean
        poll:
          oneOf:
            - $ref: "#/components/schemas/Poll"
            - type: "null"
        isOwnedByMe:
          type: boolean
        content:
          type: string
        category:
          type: string
          enum: [Shuttle Updates, Portal Down, Exam Timetable, Amebo Hot, Campus News, Strike Update]
        imageUrl:
          type: ["string", "null"]
        blurDataUrl:
          type: ["string", "null"]
          maxLength: 10950
          pattern: '^data:image/webp;base64,[A-Za-z0-9+/]+={0,2}$'
        videoUrl:
          type: ["string", "null"]
        likesCount:
          type: integer
        isLikedByMe:
          type: boolean
        noCapsCount:
          type: integer
        isNoCapByMe:
          type: boolean
        commentsCount:
          type: integer
        reshareCount:
          type: integer
        originalPostId:
          type: ["integer", "null"]
        originalPost:
          oneOf:
            - $ref: '#/components/schemas/EmbeddedPost'
            - type: "null"
        isPinnedToProfile:
          type: boolean
        isPinnedToFeed:
          type: boolean
        isSavedByMe:
          type: boolean
