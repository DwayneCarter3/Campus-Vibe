openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CampusX API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: posts
    description: Feed post operations
  - name: services
    description: Earn Legally marketplace services
  - name: stats
    description: Dashboard statistics
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Get current user profile (includes private fields)
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    put:
      operationId: updateMyProfile
      tags: [users]
      summary: Create or update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /users/{userId}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a public user profile (private fields excluded)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserProfile"
        "404":
          description: User not found

  /users/{userId}/posts:
    get:
      operationId: getUserPosts
      tags: [users]
      summary: Get all posts by a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: User posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPostsResponse"
        "404":
          description: User not found

  /users/{userId}/services:
    get:
      operationId: getUserServices
      tags: [users]
      summary: Get all active services by a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: User services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServicesResponse"
        "404":
          description: User not found

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List feed posts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: faculty
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPostsResponse"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a new feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a single post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post (owner only)
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /posts/{postId}/like:
    post:
      operationId: likePost
      tags: [posts]
      summary: Toggle fire reaction on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fire toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "401":
          description: Unauthorized

  /posts/{postId}/nocap:
    post:
      operationId: noCapPost
      tags: [posts]
      summary: Toggle no-cap reaction on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: No Cap toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoCapResponse"
        "401":
          description: Unauthorized

  /posts/{postId}/comments:
    get:
      operationId: listPostComments
      tags: [posts]
      summary: List comments on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommentsResponse"
        "404":
          description: Post not found
    post:
      operationId: createPostComment
      tags: [posts]
      summary: Add a comment to a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List marketplace services
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: category
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServicesResponse"
    post:
      operationId: createService
      tags: [services]
      summary: List a new service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceBody"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /services/{serviceId}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a single service listing
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service listing (owner only)
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceBody"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service listing (owner only)
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List recent notifications for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNotificationsResponse"
        "401":
          description: Unauthorized

  /notifications/read:
    patch:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All notifications marked as read
        "401":
          description: Unauthorized

  /services/{serviceId}/whatsapp-click:
    post:
      operationId: trackWhatsappClick
      tags: [services]
      summary: Track a WhatsApp interest click and notify the provider
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /stats/feed:
    get:
      operationId: getFeedStats
      tags: [stats]
      summary: Get feed statistics (post counts by faculty, trending topics)
      responses:
        "200":
          description: Feed stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedStats"

  /posts/{postId}/pin-profile:
    patch:
      tags: [posts]
      operationId: pinPostToProfile
      summary: Toggle pin post to user's profile
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pin toggled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinResponse'
        '401':
          description: Unauthorized.
        '403':
          description: Not the author.
        '404':
          description: Post not found.

  /posts/{postId}/pin-feed:
    patch:
      tags: [posts]
      operationId: pinPostToFeed
      summary: Toggle pin post to main feed (admin only)
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pin toggled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinResponse'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden – admin only.
        '404':
          description: Post not found.

  /admin/claim:
    post:
      tags: [posts]
      operationId: claimAdmin
      summary: Bootstrap – claim admin role (only works if no admin exists)
      responses:
        '200':
          description: Admin role claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClaimResponse'
        '403':
          description: An admin already exists.
        '401':
          description: Unauthorized.

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.

  /stats/marketplace:
    get:
      operationId: getMarketplaceStats
      tags: [stats]
      summary: Get marketplace stats (service counts by category)
      responses:
        "200":
          description: Marketplace stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceStats"

components:
  schemas:
    AppNotification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        actorName:
          type: ["string", "null"]
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - type
        - actorName
        - message
        - isRead
        - createdAt

    ListNotificationsResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/AppNotification"
        unreadCount:
          type: integer
      required:
        - notifications
        - unreadCount

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        fullName:
          type: string
        email:
          type: string
        school:
          type: string
        campusLocation:
          type: string
        level:
          type: string
        faculty:
          type: string
        enrollmentStatus:
          type: string
        matricNumber:
          type: string
        campus:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clerkUserId
        - fullName
        - email
        - school
        - campusLocation
        - level
        - faculty
        - enrollmentStatus
        - matricNumber
        - campus
        - bio
        - avatarUrl
        - isAdmin
        - createdAt

    PublicUserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        fullName:
          type: string
        school:
          type: string
        campusLocation:
          type: string
        level:
          type: string
        faculty:
          type: string
        enrollmentStatus:
          type: string
        campus:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isVerified:
          type: boolean
      required:
        - id
        - clerkUserId
        - fullName
        - school
        - campusLocation
        - level
        - faculty
        - enrollmentStatus
        - campus
        - bio
        - avatarUrl
        - isVerified

    UpdateProfileBody:
      type: object
      properties:
        fullName:
          type: string
        school:
          type: string
        campusLocation:
          type: string
        level:
          type: string
        faculty:
          type: string
        enrollmentStatus:
          type: string
        matricNumber:
          type: string
        campus:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]

    Post:
      type: object
      properties:
        id:
          type: integer
        authorId:
          type: string
        authorName:
          type: string
        authorFaculty:
          type: string
        authorLevel:
          type: string
        authorCampusLocation:
          type: string
        authorAvatarUrl:
          type: ["string", "null"]
        content:
          type: string
        imageUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        likesCount:
          type: integer
        isLikedByMe:
          type: boolean
        noCapsCount:
          type: integer
        isNoCapByMe:
          type: boolean
        commentsCount:
          type: integer
        isPinnedToProfile:
          type: boolean
        isPinnedToFeed:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - authorId
        - authorName
        - authorFaculty
        - authorLevel
        - authorCampusLocation
        - authorAvatarUrl
        - content
        - imageUrl
        - videoUrl
        - likesCount
        - isLikedByMe
        - noCapsCount
        - isNoCapByMe
        - commentsCount
        - isPinnedToProfile
        - isPinnedToFeed
        - createdAt

    ListPostsResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        total:
          type: integer
      required:
        - posts
        - total

    CreatePostBody:
      type: object
      properties:
        content:
          type: string
        imageUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
      required:
        - content

    LikeResponse:
      type: object
      properties:
        liked:
          type: boolean
        likesCount:
          type: integer
      required:
        - liked
        - likesCount

    NoCapResponse:
      type: object
      properties:
        noCaped:
          type: boolean
        noCapsCount:
          type: integer
      required:
        - noCaped
        - noCapsCount

    Comment:
      type: object
      properties:
        id:
          type: integer
        postId:
          type: integer
        authorId:
          type: string
        authorName:
          type: string
        authorLevel:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - postId
        - authorId
        - authorName
        - authorLevel
        - content
        - createdAt

    ListCommentsResponse:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        total:
          type: integer
      required:
        - comments
        - total

    CreateCommentBody:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - content

    Service:
      type: object
      properties:
        id:
          type: integer
        providerId:
          type: string
        providerName:
          type: string
        providerFaculty:
          type: string
        providerLevel:
          type: string
        providerCampusLocation:
          type: string
        providerIsVerified:
          type: boolean
        providerAvatarUrl:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: ["string", "null"]
        contactInfo:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - providerId
        - providerName
        - providerFaculty
        - providerLevel
        - providerCampusLocation
        - providerIsVerified
        - providerAvatarUrl
        - title
        - description
        - category
        - price
        - contactInfo
        - isActive
        - createdAt

    ListServicesResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        total:
          type: integer
      required:
        - services
        - total

    CreateServiceBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: ["string", "null"]
        contactInfo:
          type: string
      required:
        - title
        - description
        - category
        - contactInfo

    UpdateServiceBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: ["string", "null"]
        contactInfo:
          type: string
        isActive:
          type: boolean

    FeedStats:
      type: object
      properties:
        totalPosts:
          type: integer
        postsByFaculty:
          type: array
          items:
            $ref: "#/components/schemas/FacultyCount"
        recentActivity:
          type: integer
      required:
        - totalPosts
        - postsByFaculty
        - recentActivity

    FacultyCount:
      type: object
      properties:
        faculty:
          type: string
        count:
          type: integer
      required:
        - faculty
        - count

    MarketplaceStats:
      type: object
      properties:
        totalServices:
          type: integer
        servicesByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
      required:
        - totalServices
        - servicesByCategory

    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
        - category
        - count

    PinResponse:
      type: object
      required: [pinned]
      properties:
        pinned:
          type: boolean

    AdminClaimResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
